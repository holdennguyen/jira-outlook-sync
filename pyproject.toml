[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-outlook-sync"
version = "1.0.0"
description = "Interactive CLI tool to sync Jira tickets to Outlook calendar with browser OAuth"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "OPSWAT", email = "support@opswat.com"}
]
keywords = ["jira", "outlook", "calendar", "sync", "reminder", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
    "msal>=1.20.0",
    "colorama>=0.4.6",
    "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "types-requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/holdennguyen/jira-outlook-sync"
Repository = "https://github.com/holdennguyen/jira-outlook-sync"
Issues = "https://github.com/holdennguyen/jira-outlook-sync/issues"

[project.scripts]
jira-outlook-sync = "jira_outlook_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=jira_outlook_sync --cov-report=term-missing --cov-report=html"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
